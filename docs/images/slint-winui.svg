<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Slint WinUI</title>
  <desc>A hand-drawn SW monogram inside a layered WinUI navigation window.</desc>
  <defs>
    <linearGradient id="shell" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2c60de"/>
      <stop offset="1" stop-color="#142454"/>
    </linearGradient>
    <linearGradient id="back-pane" x1="36" y1="20" x2="114" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9efbe3"/>
      <stop offset="1" stop-color="#42bdde"/>
    </linearGradient>
    <linearGradient id="letter-s" x1="50" y1="60" x2="66" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#007dbe"/>
      <stop offset="1" stop-color="#128591"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#shell)"/>
  <rect x="5" y="5" width="118" height="118" rx="27" fill="none" stroke="#bed7ff" stroke-opacity=".28"/>
  <rect x="34" y="20" width="80" height="70" rx="12" fill="url(#back-pane)"/>
  <path d="M46 26h56a6 6 0 0 1 6 6" fill="none" stroke="#e0fff5" stroke-width="2" stroke-linecap="round" opacity=".69"/>

  <rect x="16" y="38" width="94" height="68" rx="12" fill="#101d53" opacity=".38"/>
  <rect x="16" y="34" width="94" height="68" rx="12" fill="#f6f9ff"/>
  <path d="M16 50h94" fill="none" stroke="#d1dfff" stroke-width="2"/>
  <path d="M26 42h10m66 0h-6" fill="none" stroke="#8dabee" stroke-width="2" stroke-linecap="round"/>

  <rect x="24" y="58" width="16" height="36" rx="4" fill="#d8e7ff"/>
  <path d="M28 66h8" fill="none" stroke="#2f62e2" stroke-width="4" stroke-linecap="round"/>
  <path d="M28 76h6m-6 8h6" fill="none" stroke="#87a6ed" stroke-width="2" stroke-linecap="round"/>

  <path d="M66 60H56l-6 6v2l6 6h4l6 6v2l-6 6H50"
        fill="none" stroke="url(#letter-s)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 60l4 28 8-14 8 14 8-28"
        fill="none" stroke="#2f53ce" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
